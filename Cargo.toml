[workspace]
resolver = "2"
members = [
    "crates/backlog-rank",
    "crates/capacity-plan",
    "crates/done-gate",
    "crates/five-whys",
    "crates/story-contract",
    "crates/team-skill",
    "crates/working-agreement",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paiml/agile-practices-using-ai"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
