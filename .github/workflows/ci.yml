name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pv
        run: cargo install aprender-contracts-cli --version 0.71.1 --locked
      - name: Gate
        run: make gate

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlite3 is present
        run: command -v sqlite3 || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
      - name: Labs
        run: make labs
